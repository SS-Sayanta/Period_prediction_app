      from { opacity: 0; transform: translateY(16px) scale(0.98); }

    /* ── Chat Widget Styles ──────────────────────────────────── */
    .chat-scrollbox {
      scrollbar-width: thin;
      scrollbar-color: rgba(244,114,182,0.35) transparent;
    }
    .chat-scrollbox::-webkit-scrollbar { width: 4px; }
    .chat-scrollbox::-webkit-scrollbar-track { background: transparent; }
    .chat-scrollbox::-webkit-scrollbar-thumb {
      background: rgba(244,114,182,0.4);
      border-radius: 99px;
    }

    /* User bubble */
    .bubble-user {
      background: linear-gradient(135deg, #be185d 0%, #9333ea 100%);
      color: #fff;
      border-radius: 18px 18px 4px 18px;
      padding: 9px 13px;
      font-size: 12px;
      line-height: 1.55;
      max-width: 88%;
      box-shadow: 0 4px 16px -4px rgba(190,24,93,0.45);
      word-break: break-word;
    }

    /* AI bubble */
    .bubble-ai {
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(244,114,182,0.2);
      border-radius: 18px 18px 18px 4px;
      padding: 10px 13px;
      font-size: 12px;
      line-height: 1.65;
      max-width: 92%;
      color: #e2e8f0;
      word-break: break-word;
    }
    /* Markdown inside AI bubble */
    .bubble-ai p   { margin: 0 0 6px; }
    .bubble-ai p:last-child { margin-bottom: 0; }
    .bubble-ai ul  { margin: 4px 0 6px 16px; list-style: disc; }
    .bubble-ai ol  { margin: 4px 0 6px 18px; list-style: decimal; }
    .bubble-ai li  { margin-bottom: 3px; }
    .bubble-ai strong { color: #f9a8d4; font-weight: 600; }
    .bubble-ai em  { color: #94a3b8; }
    .bubble-ai code {
      background: rgba(244,114,182,0.12);
      border: 1px solid rgba(244,114,182,0.2);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
      font-family: monospace;
      color: #f9a8d4;
    }
    .bubble-ai pre {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(244,114,182,0.15);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 6px 0;
      overflow-x: auto;
      font-size: 11px;
    }
    .bubble-ai h1,.bubble-ai h2,.bubble-ai h3 {
      color: #f9a8d4;
      font-weight: 700;
      margin: 6px 0 4px;
    }

    /* Typing dots */
    @keyframes typingBounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30%          { transform: translateY(-5px); opacity: 1; }
    }
    .typing-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #f472b6;
      display: inline-block;
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    /* Quick-prompt chips */
    .chip {
      background: rgba(30,41,59,0.7);
      border: 1px solid rgba(244,114,182,0.25);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 10.5px;
      font-weight: 500;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
    }
    .chip:hover {
      background: rgba(244,114,182,0.15);
      border-color: rgba(244,114,182,0.55);
      color: #f9a8d4;
      box-shadow: 0 0 14px -4px rgba(244,114,182,0.4);

    .chat-input::placeholder { color: #475569; }

    /* ── Global Responsive Reset & Overflow Prevention ────────── */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body, #root {
      overflow-x: hidden;
      max-width: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }
    img, video, iframe, canvas, svg {
      max-width: 100%;
      height: auto;
    }

    /* ── Sidebar responsive ──────────────────────────────────── */
    .sidebar {
      width: 100%;
      background: rgba(15, 23, 42, 0.97);
      border-right: none;
      border-bottom: 1px solid rgba(51,65,85,1);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), padding 0.2s;
      overflow: hidden;
    }
    .sidebar.collapsed { max-height: 60px; padding-top: 10px; padding-bottom: 10px; }
    .sidebar.expanded  { max-height: min(100vh, 100dvh); overflow-y: auto; }
    @media (min-width: 768px) {
      .sidebar {
        width: 300px;
        min-width: 260px;
        max-width: 320px;
        max-height: none !important;
        border-right: 1px solid rgba(51,65,85,1);
        border-bottom: none;
        padding: 20px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(244,114,182,0.25) transparent;

      .sidebar-toggle-btn { display: none !important; }
      .sidebar-inner { display: flex !important; }

    .sidebar-inner { display: flex; flex-direction: column; gap: 0; }
    @media (max-width: 767px) {
      .sidebar.collapsed .sidebar-inner { display: none; }
      .sidebar.expanded  .sidebar-inner { display: flex; }
    }

    /* ── Hamburger button ────────────────────────────────────── */
    .sidebar-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #f9a8d4;
    }
    .hamburger-icon {
      display: flex; flex-direction: column; gap: 4px;
    }
    .hamburger-icon span {
      display: block; width: 20px; height: 2px;
      background: #f472b6; border-radius: 2px;
      transition: all 0.2s;
    }

    /* ── Chat box dvh-aware heights ──────────────────────────── */
    .chat-msg-box {
      min-height: 120px;
      max-height: min(240px, 30dvh);
      overflow-y: auto;
    }
    .chat-container { max-height: min(420px, 60dvh); }
    @media (max-width: 767px) {
      .chat-msg-box   { max-height: min(200px, 28dvh); }
      .chat-container { max-height: min(380px, 55dvh); }

    /* ── Chip grid: wrap neatly on mobile screens ───────────── */
    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip-grid > button {
      flex: 1 1 calc(50% - 6px);
      min-width: 110px;
    }
    @media (max-width: 400px) {
      .chip-grid > button {
        flex: 1 1 100%;
      }
    }

    /* ── Metric cards responsive grid ───────────────────────── */
    .metric-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(2, 1fr);
    }
    @media (min-width: 1024px) {
      .metric-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 480px) {
      .metric-grid { grid-template-columns: 1fr; }
    }

    /* ── Main content area ───────────────────────────────────── */
    .main-content {
      flex: 1;
      min-width: 0;
      max-width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 16px;
    }
    @media (min-width: 768px)  { .main-content { padding: 24px; } }
    @media (min-width: 1024px) { .main-content { padding: 32px; } }

    /* ── Input fields full-width safety ──────────────────────── */
    input, select, textarea {
      max-width: 100%;
      box-sizing: border-box;
    }

    /* ── Form grid (prediction inputs) ──────────────────────── */
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .form-grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {

    }

    /* ── Toast position on mobile ────────────────────────────── */
    @media (max-width: 640px) {
      .toast-wrap { bottom: 12px !important; right: 12px !important; left: 12px !important; }
      .toast-wrap > div { width: 100%; }
    }
  </style>
</head>

    const formatDateStr = (dateStr) => {
      if (!dateStr) return '---';
      try {
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);
        const dt = new Date(y, m, d);
        return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      } catch (e) {
        return dateStr;

    function App() {
      const resultCardRef = React.useRef(null);
      const [currentLang, setCurrentLang] = useState(() => {
        return localStorage.getItem('femcare_lang') || 'en';
      });

      const changeLanguage = (lang) => {
        setCurrentLang(lang);
        localStorage.setItem('femcare_lang', lang);
      };

      const t = (key) => {
        return (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) ||
               (TRANSLATIONS['en'] && TRANSLATIONS['en'][key]) ||
               key;
      };
      const [activeTab, setActiveTab] = useState('overview');
      const [operatingMode, setOperatingMode] = useState('🌸 Cycle Tracking');
      const [overviewData, setOverviewData] = useState(null);
      const [analyticsData, setAnalyticsData] = useState(null);
      const [calendarData, setCalendarData] = useState(null);
      const [calYear, setCalYear] = useState(new Date().getFullYear());
      const [calMonth, setCalMonth] = useState(new Date().getMonth() + 1);
      
      const [assistantQuery, setAssistantQuery] = useState('');
      const [assistantResponse, setAssistantResponse] = useState('');
      const [assistantOpen, setAssistantOpen] = useState(false);

      // Loading & Feedback Toast States
      const [toast, setToast] = useState(null);
      const [isPredicting, setIsPredicting] = useState(false);
      const [isLoggingSymptom, setIsLoggingSymptom] = useState(false);
      const [isSubmittingFeedback, setIsSubmittingFeedback] = useState(false);
      const [lastPredictionResult, setLastPredictionResult] = useState(null);

      // Conditional Active ML Calendar State
      const [isCalculated, setIsCalculated] = useState(() => {
        return localStorage.getItem('femcare_is_calculated') === 'true';
      });

      // Interactive Calendar Day Selection Modal State
      const [selectedDay, setSelectedDay] = useState(null);
      const [daySymptomForm, setDaySymptomForm] = useState({ flow_level: 'None', cramps: 0, notes: '' });
      const [isSavingDaySymptom, setIsSavingDaySymptom] = useState(false);

      const handleResetCalendar = () => {
        localStorage.removeItem('femcare_is_calculated');
        setIsCalculated(false);
        showToast('ℹ️ Calendar reset to clean uninitialized state.', 'info');
      };

      const [formData, setFormData] = useState({
        last_period_date: new Date().toISOString().split('T')[0],
        age: 25,
        weight_kg: 60.0,
        last_cycle_length: 28.0,
        cycle_length_2: 28.0,
        cycle_length_3: 28.0,
        stress_level: 3,
        avg_sleep_hours: 7.5,
        exercise_hours: 3.0,
        water_intake_liters: 2.0
      });

      const [symptomForm, setSymptomForm] = useState({
        log_date: new Date().toISOString().split('T')[0],
        flow_level: 'None',
        cramps: 1,
        fatigue: 1,
        notes: ''
      });

      const [feedbackForm, setFeedbackForm] = useState({
        feedback_date: new Date().toISOString().split('T')[0],
        actual_cycle_length: 28.0
      });

      useEffect(() => {
        fetchOverview();
      }, []);

      useEffect(() => {
        if (activeTab === 'calendar') fetchCalendar();
        if (activeTab === 'analytics') fetchAnalytics();
      }, [activeTab, calYear, calMonth]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => {
          setToast(prev => (prev && prev.message === message ? null : prev));
        }, 4000);
      };

      const fetchOverview = async () => {
        try {
          const res = await fetch('/api/prediction/overview');
          const data = await res.json();
          setOverviewData(data);
        } catch (err) {
          console.error("Error fetching overview", err);
        }
      };

      const fetchCalendar = async () => {
        try {
          const pDate = formData.last_period_date || (overviewData && overviewData.feature_summary ? overviewData.feature_summary.last_period_date : new Date().toISOString().split('T')[0]);
          const cycleLen = overviewData ? overviewData.predicted_cycle_days : formData.last_cycle_length;
          const res = await fetch(`/api/calendar/events?year=${calYear}&month=${calMonth}&last_period_date=${pDate}&cycle_days=${cycleLen}`);
          if (!res.ok) throw new Error('Calendar API response error');
          const data = await res.json();
          setCalendarData(data);
        } catch (err) {
          console.error("Error fetching calendar", err);
        }
      };

      const fetchAnalytics = async () => {
        try {
          const res = await fetch('/api/analytics');
          const data = await res.json();
          setAnalyticsData(data);
        } catch (err) {
          console.error("Error fetching analytics", err);
        }
      };

      const handleRunPrediction = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        setIsPredicting(true);
        try {
          const res = await fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
          });
          if (!res.ok) throw new Error('Prediction API Error');
          const data = await res.json();
          setOverviewData(data);
          setLastPredictionResult(data);
          localStorage.setItem('femcare_is_calculated', 'true');
          setIsCalculated(true);
          showToast('✓ ML Forecast Successfully Generated', 'success');

          setTimeout(() => {
            if (resultCardRef.current) {
              resultCardRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          }, 150);
        } catch (err) {
          console.error("Prediction error", err);
          showToast('❌ Error updating forecast prediction', 'error');
        } finally {
          setIsPredicting(false);
        }
      };

      const handleLogSymptoms = async (e) => {
        e.preventDefault();
        setIsLoggingSymptom(true);
        try {
          const res = await fetch('/api/symptoms/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(symptomForm)
          });
          if (res.ok) {
            showToast('✓ Daily symptom log saved successfully!', 'success');
            if (activeTab === 'calendar') fetchCalendar();
          } else {
            throw new Error('Log failed');
          }
        } catch (err) {
          showToast('❌ Error logging symptoms', 'error');
        } finally {
          setIsLoggingSymptom(false);
        }
      };

      const handleSubmitFeedback = async (e) => {
        e.preventDefault();
        setIsSubmittingFeedback(true);
        try {
          const res = await fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(feedbackForm)
          });
          if (res.ok) {
            showToast('✓ Ground truth period verified! Predictions recalibrated.', 'success');
            fetchOverview();
            if (activeTab === 'calendar') fetchCalendar();
          } else {
            throw new Error('Feedback failed');
          }
        } catch (err) {
          showToast('❌ Error submitting feedback', 'error');
        } finally {
          setIsSubmittingFeedback(false);
        }
      };

      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [isAssistantLoading, setIsAssistantLoading] = useState(false);
      const [chatMessages, setChatMessages] = useState([]);
      const chatEndRef = React.useRef(null);

      // Auto-scroll to latest message
      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [chatMessages, isAssistantLoading]);

      const handleAssistantQuery = async (queryText) => {
        const q = (queryText || assistantQuery).trim();
        if (!q) return;
        setAssistantQuery('');

        // Push user message immediately
        setChatMessages(prev => [...prev, { role: 'user', text: q }]);
        setIsAssistantLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              query: q,
              current_phase: overviewData ? overviewData.current_phase : 'Follicular',
              operating_mode: operatingMode,
              age: formData.age,
              stress_level: formData.stress_level
            })
          });
          const data = await res.json();
          const reply = data.response || data.answer || '❌ No response received.';
          setChatMessages(prev => [...prev, { role: 'ai', text: reply }]);
        } catch (err) {
          setChatMessages(prev => [...prev, { role: 'ai', text: '❌ Failed to reach AI. Please check your connection.' }]);
        } finally {
          setIsAssistantLoading(false);
        }
      };

      // Calendar Navigation & Interactive Day Select Handlers
      const handlePrevMonth = () => {
        if (calMonth === 1) {
          setCalMonth(12);
          setCalYear(calYear - 1);
        } else {
          setCalMonth(calMonth - 1);
        }
      };

      const handleNextMonth = () => {
        if (calMonth === 12) {
          setCalMonth(1);
          setCalYear(calYear + 1);
        } else {
          setCalMonth(calMonth + 1);
        }
      };

      const handleCurrentMonth = () => {
        const now = new Date();
        setCalYear(now.getFullYear());
        setCalMonth(now.getMonth() + 1);
      };

      const handleSelectDay = (day) => {
        setSelectedDay(day);
        setDaySymptomForm({
          flow_level: day.symptom_detail ? day.symptom_detail.flow : 'None',
          cramps: day.symptom_detail ? day.symptom_detail.cramps : 0,
          notes: day.symptom_detail ? day.symptom_detail.notes : ''
        });
      };

      const handleSaveDaySymptom = async (e) => {
        e.preventDefault();
        if (!selectedDay) return;
        setIsSavingDaySymptom(true);
        try {
          const res = await fetch('/api/symptoms/log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              log_date: selectedDay.date,
              flow_level: daySymptomForm.flow_level,
              cramps: daySymptomForm.cramps,
              notes: daySymptomForm.notes
            })
          });
          if (res.ok) {
            showToast(`✓ Symptom log saved for ${formatDateStr(selectedDay.date)}`, 'success');
            setSelectedDay(null);
            await fetchCalendar();
            fetchOverview();
          } else {
            throw new Error('Save failed');
          }
        } catch (err) {
          showToast('❌ Error saving day symptom log', 'error');
        } finally {
          setIsSavingDaySymptom(false);
        }
      };

      const activeMLData = lastPredictionResult || overviewData;

      // Safe markdown parser with plain-text fallback
      const parseMarkdown = (text) => {
        try {
          if (typeof marked !== 'undefined' && marked.parse) {
            return marked.parse(text);
          }
        } catch (e) { /* fall through */ }
        // Fallback: escape HTML and preserve line breaks
        return text
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/\n/g, '<br>');
      };

      return (
        <div className="min-h-screen flex flex-col md:flex-row relative">
          {/* FLOATING TOAST FEEDBACK BANNER */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 animate-toast-in toast-wrap">
              <div className={`flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl backdrop-blur-xl border ${
                toast.type === 'error'
                  ? 'bg-slate-900/95 border-rose-500/50 text-rose-300'
                  : 'bg-slate-900/95 border-emerald-500/50 text-emerald-300'
              }`}>
                <span className="text-base">{toast.type === 'error' ? '❌' : '✓'}</span>
                <span className="text-xs font-semibold tracking-wide">{toast.message}</span>
                <button onClick={() => setToast(null)} className="ml-2 text-slate-400 hover:text-white text-xs font-bold focus:outline-none cursor-pointer">✕</button>
              </div>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className={`sidebar ${sidebarOpen ? 'expanded' : 'collapsed'}`}>

            {/* Mobile Hamburger Header — hidden on md+ */}
            <button className="sidebar-toggle-btn" onClick={() => setSidebarOpen(!sidebarOpen)}>
              <div className="flex items-center gap-2">
                <span className="text-2xl">🌸</span>
                <div className="text-left">
                  <span className="font-display text-base font-bold text-pink-400 leading-none block">{t('appName')}</span>
                  <span className="text-[9px] tracking-widest text-slate-400 uppercase font-semibold">{t('appSubtitle')}</span>
                </div>
              </div>
              <div className="hamburger-icon">
                <span style={{transform: sidebarOpen ? 'rotate(45deg) translate(4px,4px)' : ''}}></span>
                <span style={{opacity: sidebarOpen ? 0 : 1}}></span>
                <span style={{transform: sidebarOpen ? 'rotate(-45deg) translate(4px,-4px)' : ''}}></span>
              </div>
            </button>

            {/* Sidebar inner content */}
            <div className="sidebar-inner">
              <div className="space-y-4">
                <div className="text-center py-2 pb-4 border-b border-slate-800 mb-4">

                    <div className="flex items-center gap-2">
                      <span className="text-2xl">🌸</span>
                      <div className="text-left">
                        <h1 className="font-display text-lg font-bold text-pink-400 leading-none">{t('appName')}</h1>
                        <p className="text-[9px] tracking-widest text-slate-400 uppercase font-semibold">{t('appSubtitle')}</p>
                      </div>
                    </div>
                  </div>
                  <div className="mt-3 flex items-center justify-between bg-slate-950/80 p-2 rounded-xl border border-pink-500/40">
                    <span className="text-xs font-semibold text-pink-400">{t('langSelect')}:</span>
                    <select value={currentLang} onChange={(e) => changeLanguage(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-200 font-semibold focus:outline-none focus:border-pink-500 cursor-pointer">
                      <option value="en">🌐 English</option>
                      <option value="bn">🌐 বাংলা (Bengali)</option>
                      <option value="hi">🌐 हिंदी (Hindi)</option>
                    </select>
                  </div>
                </div>

                <div className="my-4 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold text-center flex items-center justify-center gap-1.5">
                  <span>🤖</span> ML Engine Active (RandomForest)
                </div>

                <div className="mb-5">

                    <option value="🌸 Cycle Tracking">{t('modeCycle')}</option>
                    <option value="🌿 Conception / Ovulation Peak">🌿 Conception / Ovulation Peak</option>
                    <option value="👶 Pregnancy Mode">{t('modePregnancy')}</option>
                  </select>

                    { id: 'export', icon: '📜', label: t('navExport') }
                  ].map(tab => (

                  📥 Download Clinical PDF Doctor Report
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
